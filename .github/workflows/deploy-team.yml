name: Deploy TEAM Application (Full Automated)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-team-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  MANAGEMENT_ACCOUNT: ${{ vars.MANAGEMENT_ACCOUNT }}
  TEAM_ACCOUNT: ${{ vars.TEAM_ACCOUNT }}
  TEAM_ROLE_B_ARN: ${{ vars.TEAM_ROLE_B_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Management account setup (Role A)
      - name: Configure AWS credentials (Role A)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate parameters.sh
        shell: bash
        run: |
          cat > deployment/parameters.sh <<'EOF'
          IDC_LOGIN_URL="${{ vars.IDC_LOGIN_URL }}"
          REGION="${{ vars.AWS_REGION }}"
          TEAM_ACCOUNT="${{ vars.TEAM_ACCOUNT }}"
          ORG_MASTER_PROFILE=""
          TEAM_ACCOUNT_PROFILE=""
          TEAM_ADMIN_GROUP="${{ vars.TEAM_ADMIN_GROUP }}"
          TEAM_AUDITOR_GROUP="${{ vars.TEAM_AUDITOR_GROUP }}"
          TAGS="${{ vars.TAGS }}"
          CLOUDTRAIL_AUDIT_LOGS="${{ vars.CLOUDTRAIL_AUDIT_LOGS }}"
          UI_DOMAIN="${{ vars.UI_DOMAIN }}"
          SECRET_NAME="${{ vars.SECRET_NAME }}"
          CACHE_TTL=604800
          EOF

      - name: Run init.sh (delegated admin setup)
        shell: bash
        run: |
          chmod +x deployment/init.sh
          ./deployment/init.sh

      # Step 2: TEAM account deployment (Role B)
      - name: Configure AWS credentials (Role B)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TEAM_ROLE_B_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies for deploy scripts
        shell: bash
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          pipx install git-remote-codecommit
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run deploy.sh
        shell: bash
        run: |
          chmod +x deployment/deploy.sh
          ./deployment/deploy.sh

      - name: Wait for Amplify app availability
        shell: bash
        run: |
          APP_ID="$(aws cloudformation describe-stacks \
            --stack-name TEAM-IDC-APP \
            --query "Stacks[0].Outputs[?OutputKey=='AppId'].OutputValue" \
            --output text)"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "None" ]; then
            echo "No AppId output found on stack TEAM-IDC-APP"
            exit 1
          fi

          echo "Amplify App ID: $APP_ID"
          for i in {1..60}; do
            STATUS="$(aws amplify get-app --app-id "$APP_ID" --query 'app.status' --output text)"
            echo "Amplify status: $STATUS (attempt $i/60)"
            if [ "$STATUS" = "AVAILABLE" ]; then
              exit 0
            fi
            if [ "$STATUS" = "FAILED" ]; then
              echo "Amplify app status FAILED"
              exit 1
            fi
            sleep 30
          done

          echo "Timed out waiting for Amplify app to become AVAILABLE"
          exit 1

      - name: Run integration.sh and capture SAML parameters
        id: saml
        shell: bash
        run: |
          chmod +x deployment/integration.sh
          ./deployment/integration.sh > /tmp/saml.txt

          START_URL="$(awk '/applicationStartURL/ {print $2}' /tmp/saml.txt | tail -1)"
          ACS_URL="$(awk '/applicationACSURL/ {print $2}' /tmp/saml.txt | tail -1)"
          AUDIENCE="$(awk '/applicationSAMLAudience/ {print $2}' /tmp/saml.txt | tail -1)"

          if [ -z "$START_URL" ] || [ -z "$ACS_URL" ] || [ -z "$AUDIENCE" ]; then
            echo "Failed to parse SAML values from integration.sh output"
            cat /tmp/saml.txt
            exit 1
          fi

          echo "START_URL=$START_URL" >> "$GITHUB_OUTPUT"
          echo "ACS_URL=$ACS_URL" >> "$GITHUB_OUTPUT"
          echo "AUDIENCE=$AUDIENCE" >> "$GITHUB_OUTPUT"

      # Step 3: Create/update SAML app in management account (Role A)
      - name: Switch to management account (Role A)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create or update SAML 2.0 application
        id: saml_app
        shell: bash
        run: |
          INSTANCE_ARN="$(aws sso-admin list-instances \
            --region "${{ vars.AWS_REGION }}" \
            --query "Instances[0].InstanceArn" \
            --output text)"

          if [ -z "$INSTANCE_ARN" ] || [ "$INSTANCE_ARN" = "None" ]; then
            echo "Could not determine IAM Identity Center instance ARN"
            exit 1
          fi

          APP_ARN="$(aws sso-admin list-applications \
            --instance-arn "$INSTANCE_ARN" \
            --region "${{ vars.AWS_REGION }}" \
            --query "Applications[?Name=='TEAM-IDC-APP'].ApplicationArn | [0]" \
            --output text)"

          PORTAL_JSON="$(printf '{"SignInUrl":"%s"}' "${{ steps.saml.outputs.START_URL }}")"

          if [ -z "$APP_ARN" ] || [ "$APP_ARN" = "None" ]; then
            APP_ARN="$(aws sso-admin create-application \
              --instance-arn "$INSTANCE_ARN" \
              --name "TEAM-IDC-APP" \
              --description "TEAM Temporary Elevated Access Management" \
              --application-provider-arn "arn:aws:sso::aws:applicationProvider/custom" \
              --portal-options "$PORTAL_JSON" \
              --query "ApplicationArn" \
              --output text)"
          else
            aws sso-admin update-application \
              --instance-arn "$INSTANCE_ARN" \
              --application-arn "$APP_ARN" \
              --portal-options "$PORTAL_JSON" \
              --region "${{ vars.AWS_REGION }}"
          fi

          INSTANCE_ID="${INSTANCE_ARN##*/}"
          METADATA_URL="https://portal.sso.${{ vars.AWS_REGION }}.amazonaws.com/saml/metadata/${INSTANCE_ID}"
          echo "METADATA_URL=$METADATA_URL" >> "$GITHUB_OUTPUT"

      # Step 4: Cognito setup in TEAM account (Role B)
      - name: Switch back to TEAM account (Role B)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TEAM_ROLE_B_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run cognito.sh
        shell: bash
        run: |
          echo "{\"MetadataURL\":\"${{ steps.saml_app.outputs.METADATA_URL }}\"}" > deployment/details.json
          chmod +x deployment/cognito.sh
          ./deployment/cognito.sh

      - name: Optional setup machine authentication
        shell: bash
        run: |
          chmod +x deployment/api-machine-auth.sh
          ./deployment/api-machine-auth.sh || echo "Machine auth setup skipped."

      - name: Verify deployment
        shell: bash
        run: |
          APP_URL="$(aws amplify list-apps --query "apps[?name=='TEAM-IDC-APP'].defaultDomain | [0]" --output text)"
          if [ -n "$APP_URL" ] && [ "$APP_URL" != "None" ]; then
            curl -fsS "https://${APP_URL}"
            echo "TEAM application is online."
          else
            echo "Could not determine app URL."
            exit 1
          fi

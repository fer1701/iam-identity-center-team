name: Deploy TEAM Application (Full Automated)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  MANAGEMENT_ACCOUNT: ${{ vars.MANAGEMENT_ACCOUNT }}
  TEAM_ACCOUNT: ${{ vars.TEAM_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug role ARN
        run: |
          echo "Management Account ID from variable: ${{ vars.MANAGEMENT_ACCOUNT }}"
          echo "Full role ARN: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA"
      # ---------- STEP 1: Assume Role A (Management) ----------
      - name: Configure AWS credentials (Role A)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run init.sh (delegated admin setup)
        run: |
          cd deployment
          chmod +x init.sh
          ./init.sh

      # ---------- STEP 2: Assume Role B (TEAM Account) ----------
      - name: Configure AWS credentials (Role B)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TEAM_ROLE_B_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Generate parameters.sh
        run: |
          cd deployment
          cat > parameters.sh <<EOF
          IDC_LOGIN_URL="${{ vars.IDC_LOGIN_URL }}"
          REGION="${{ vars.AWS_REGION }}"
          TEAM_ACCOUNT="${{ vars.TEAM_ACCOUNT }}"
          ORG_MASTER_PROFILE=""
          TEAM_ACCOUNT_PROFILE=""
          TEAM_ADMIN_GROUP="${{ vars.TEAM_ADMIN_GROUP }}"
          TEAM_AUDITOR_GROUP="${{ vars.TEAM_AUDITOR_GROUP }}"
          TAGS="${{ vars.TAGS }}"
          CLOUDTRAIL_AUDIT_LOGS="${{ vars.CLOUDTRAIL_AUDIT_LOGS }}"
          UI_DOMAIN="${{ vars.UI_DOMAIN }}"
          SECRET_NAME="${{ vars.SECRET_NAME }}"
          EOF

      - name: Run deploy.sh
        run: |
          cd deployment
          chmod +x deploy.sh
          ./deploy.sh

      - name: Wait for Amplify deployment
        run: |
          APP_ID=$(aws cloudformation describe-stacks --stack-name TEAM-IDC-APP --query "Stacks[0].Outputs[?OutputKey=='AppId'].OutputValue" --output text)
          if [ -n "$APP_ID" ]; then
            echo "Amplify App ID: $APP_ID"
            while true; do
              STATUS=$(aws amplify get-app --app-id $APP_ID --query "app.status" --output text)
              echo "Amplify status: $STATUS"
              if [ "$STATUS" = "AVAILABLE" ]; then break; fi
              if [ "$STATUS" = "FAILED" ]; then exit 1; fi
              sleep 30
            done
          fi

      - name: Run integration.sh and capture SAML parameters
        id: saml
        run: |
          cd deployment
          ./integration.sh > /tmp/saml.txt
          START_URL=$(grep applicationStartURL /tmp/saml.txt | cut -d' ' -f2)
          ACS_URL=$(grep applicationACSURL /tmp/saml.txt | cut -d' ' -f2)
          AUDIENCE=$(grep applicationSAMLAudience /tmp/saml.txt | cut -d' ' -f2)
          echo "START_URL=$START_URL" >> $GITHUB_OUTPUT
          echo "ACS_URL=$ACS_URL" >> $GITHUB_OUTPUT
          echo "AUDIENCE=$AUDIENCE" >> $GITHUB_OUTPUT

      # ---------- STEP 3: Create SAML Application in IAM Identity Center ----------
      # This step assumes we are still using Role B, but the SAML app must be created in the management account.
      # So we need to switch back to management account credentials.
      - name: Switch to management account (for SAML app creation)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create or update SAML 2.0 application
        id: saml_app
        run: |
          # Check if app already exists
          APP_ARN=$(aws sso-admin list-applications --region ${{ vars.AWS_REGION }} --query "Applications[?Name=='TEAM-IDC-APP'].ApplicationArn" --output text)
          if [ -z "$APP_ARN" ]; then
            echo "Creating new SAML application..."
            APP_ARN=$(aws sso-admin create-application \
              --name "TEAM-IDC-APP" \
              --description "TEAM Temporary Elevated Access Management" \
              --application-provider-arn "arn:aws:sso::aws:applicationProvider/custom" \
              --portal-options "SignInUrl=${{ steps.saml.outputs.START_URL }}" \
              --query "ApplicationArn" --output text)
          else
            echo "Updating existing SAML application: $APP_ARN"
            aws sso-admin update-application \
              --application-arn "$APP_ARN" \
              --portal-options "SignInUrl=${{ steps.saml.outputs.START_URL }}"
          fi
          # Set ACS URL and Audience (requires the application metadata – simplified)
          # In a full implementation, you would update the application's SAML configuration.
          # For now, we rely on the fact that the application is created with the correct values.
          # Retrieve the application's metadata URL
          INSTANCE_ARN=$(aws sso-admin list-instances --region ${{ vars.AWS_REGION }} --query "Instances[0].InstanceArn" --output text)
          METADATA_URL="https://portal.sso.${{ vars.AWS_REGION }}.amazonaws.com/saml/metadata/$(echo $INSTANCE_ARN | cut -d'/' -f2)"
          echo "METADATA_URL=$METADATA_URL" >> $GITHUB_OUTPUT
          echo "APP_ARN=$APP_ARN" >> $GITHUB_OUTPUT

      # ---------- STEP 4: Configure Cognito with the SAML provider ----------
      - name: Switch back to TEAM account role for cognito.sh
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TEAM_ROLE_B_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run cognito.sh
        run: |
          cd deployment
          echo '{"MetadataURL": "${{ steps.saml_app.outputs.METADATA_URL }}"}' > details.json
          chmod +x cognito.sh
          ./cognito.sh

      - name: (Optional) Setup machine authentication
        run: |
          cd deployment
          chmod +x api-machine-auth.sh
          ./api-machine-auth.sh || echo "Machine auth setup skipped or failed."

      - name: Verify deployment
        run: |
          APP_URL=$(aws amplify list-apps --query "apps[?name=='TEAM-IDC-APP'].defaultDomain" --output text)
          if [ -n "$APP_URL" ]; then
            curl -f "https://$APP_URL" && echo "TEAM application is online."
          else
            echo "Could not determine app URL."
          fi

name: Deploy TEAM Application (Full Automated)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  MANAGEMENT_ACCOUNT: ${{ vars.MANAGEMENT_ACCOUNT }}
  TEAM_ACCOUNT: ${{ vars.TEAM_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- STEP 1: Assume Role A (Management) for init.sh ----------
      - name: Configure AWS credentials (Role A)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate parameters.sh
        run: |
          cd deployment
          cat > parameters.sh <<EOF
          IDC_LOGIN_URL="${{ vars.IDC_LOGIN_URL }}"
          REGION="${{ vars.AWS_REGION }}"
          TEAM_ACCOUNT="${{ vars.TEAM_ACCOUNT }}"
          ORG_MASTER_PROFILE=""
          TEAM_ACCOUNT_PROFILE=""
          TEAM_ADMIN_GROUP="${{ vars.TEAM_ADMIN_GROUP }}"
          TEAM_AUDITOR_GROUP="${{ vars.TEAM_AUDITOR_GROUP }}"
          TAGS="${{ vars.TAGS }}"
          CLOUDTRAIL_AUDIT_LOGS="${{ vars.CLOUDTRAIL_AUDIT_LOGS }}"
          UI_DOMAIN="${{ vars.UI_DOMAIN }}"
          SECRET_NAME="${{ vars.SECRET_NAME }}"
          CACHE_TTL=604800
          EOF

      - name: Run init.sh (delegated admin setup)
        run: |
          cd deployment
          chmod +x init.sh
          sed -i 's/^[[:space:]]*export[[:space:]]\+AWS_PROFILE=.*/unset AWS_PROFILE/' init.sh
          ./init.sh

      # ---------- STEP 2: Assume Role B (TEAM account) for deployment ----------
      - name: Assume Role B manually
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "${{ vars.TEAM_ROLE_B_ARN }}" \
            --role-session-name "GitHubActionsRoleB" \
            --duration-seconds 3600 \
            --output json)
          echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r .Credentials.AccessKeyId)" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r .Credentials.SecretAccessKey)" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo $CREDS | jq -r .Credentials.SessionToken)" >> $GITHUB_ENV
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "Successfully assumed Role B"
          aws sts get-caller-identity

      - name: Install git-remote-codecommit
        run: |
          pipx install git-remote-codecommit
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Delete existing CodeCommit repository (idempotency)
        run: |
          aws codecommit delete-repository --repository-name team-idc-app --region ${{ vars.AWS_REGION }} || echo "Repository not found, continuing."

      - name: Create CodeCommit repository
        run: |
          aws codecommit create-repository --repository-name team-idc-app --region ${{ vars.AWS_REGION }} --repository-description "Temporary Elevated Access Management (TEAM) Application"

      - name: Create fresh git repository and push to CodeCommit
        run: |
          rm -rf .git
          git init -b main
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Initial commit for TEAM deployment"
          git remote add origin codecommit::${{ vars.AWS_REGION }}://team-idc-app
          git push --force origin main

      - name: Delete existing CloudFormation stack if in failed state
        run: |
          aws cloudformation delete-stack --stack-name TEAM-IDC-APP --region ${{ vars.AWS_REGION }} || echo "Stack does not exist or already deleted"
          aws cloudformation wait stack-delete-complete --stack-name TEAM-IDC-APP --region ${{ vars.AWS_REGION }} || echo "No stack to wait for"

      - name: Patch deploy.sh to skip git commands and only deploy CloudFormation
        run: |
          cd deployment
          sed -i 's/^[[:space:]]*export[[:space:]]\+AWS_PROFILE=.*/unset AWS_PROFILE/' deploy.sh
          sed -i '/aws codecommit create-repository/ s/^/#/' deploy.sh
          sed -i '/git remote remove origin/ s/^/#/' deploy.sh
          sed -i '/git remote add origin/ s/^/#/' deploy.sh
          sed -i '/git push origin main/ s/^/#/' deploy.sh

      - name: Run deploy.sh (only CloudFormation deployment)
        run: |
          cd deployment
          chmod +x deploy.sh
          ./deploy.sh

      # ---------- STEP 3: Wait for Amplify and retrieve SAML parameters (combined) ----------

      - name: Wait for Amplify and retrieve SAML parameters
        id: saml
        timeout-minutes: 30
        run: |
          set -x
          # Get App ID from CloudFormation outputs
          APP_ID=$(aws cloudformation describe-stacks --stack-name TEAM-IDC-APP --query "Stacks[0].Outputs[?OutputKey=='AppId'].OutputValue" --output text)
          if [ -z "$APP_ID" ]; then
            echo "ERROR: Could not retrieve AppId from stack outputs"
            exit 1
          fi
          echo "APP_ID=$APP_ID" >> $GITHUB_OUTPUT

          # Wait for Amplify status AVAILABLE
          for i in {1..60}; do
            STATUS=$(aws amplify get-app --app-id $APP_ID --query "app.status" --output text 2>/dev/null || echo "UNKNOWN")
            echo "Attempt $i/60: Amplify status = $STATUS"
            if [ "$STATUS" = "AVAILABLE" ]; then
              break
            elif [ "$STATUS" = "FAILED" ]; then
              exit 1
            fi
            sleep 30
          done
          if [ $i -ge 60 ]; then
            echo "ERROR: Amplify not AVAILABLE after 30 minutes"
            exit 1
          fi

          # Get Amplify domain
          AMPLIFY_DOMAIN=$(aws amplify get-app --app-id $APP_ID --query "app.defaultDomain" --output text)
          echo "AMPLIFY_DOMAIN=$AMPLIFY_DOMAIN" >> $GITHUB_OUTPUT

          # Get Cognito User Pool ID from stack outputs
          USER_POOL_ID=$(aws cloudformation describe-stacks --stack-name TEAM-IDC-APP --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)
          if [ -z "$USER_POOL_ID" ]; then
            # Fallback to listing
            USER_POOL_ID=$(aws cognito-idp list-user-pools --max-results 20 --region ${{ vars.AWS_REGION }} --query "UserPools[?contains(Name, 'team06dbb7fc')].Id" --output text)
          fi
          if [ -z "$USER_POOL_ID" ]; then
            echo "ERROR: Could not retrieve User Pool ID"
            exit 1
          fi
          echo "USER_POOL_ID=$USER_POOL_ID" >> $GITHUB_OUTPUT

          # Get Cognito client ID from stack outputs or list
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name TEAM-IDC-APP --query "Stacks[0].Outputs[?OutputKey=='ClientId'].OutputValue" --output text)
          if [ -z "$CLIENT_ID" ]; then
            CLIENT_ID=$(aws cognito-idp list-user-pool-clients --user-pool-id $USER_POOL_ID --query "UserPoolClients[0].ClientId" --output text)
          fi
          echo "CLIENT_ID=$CLIENT_ID" >> $GITHUB_OUTPUT

          # Build SAML URLs
          COGNITO_DOMAIN="${USER_POOL_ID}.auth.${{ vars.AWS_REGION }}.amazoncognito.com"
          REDIRECT_URI="https://main.${AMPLIFY_DOMAIN}/"
          START_URL="https://${COGNITO_DOMAIN}/authorize?client_id=${CLIENT_ID}&response_type=code&scope=aws.cognito.signin.user.admin+email+openid+phone+profile&redirect_uri=${REDIRECT_URI}&idp_identifier=team"
          ACS_URL="https://${COGNITO_DOMAIN}/saml2/idpresponse"
          AUDIENCE="urn:amazon:cognito:sp:${USER_POOL_ID}"

          echo "START_URL=$START_URL" >> $GITHUB_OUTPUT
          echo "ACS_URL=$ACS_URL" >> $GITHUB_OUTPUT
          echo "AUDIENCE=$AUDIENCE" >> $GITHUB_OUTPUT

      # ---------- STEP 4: Create/Update SAML app in management account ----------
      - name: Switch to management account (Role A) for SAML app
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create or update SAML 2.0 application (fully automated)
        id: saml_app
        run: |
          START_URL="${{ steps.saml.outputs.START_URL }}"
          ACS_URL="${{ steps.saml.outputs.ACS_URL }}"
          AUDIENCE="${{ steps.saml.outputs.AUDIENCE }}"
          APP_NAME="TEAM-IDC-APP"
          INSTANCE_ARN=$(aws sso-admin list-instances --region ${{ vars.AWS_REGION }} --query 'Instances[0].InstanceArn' --output text)

          APP_ARN=$(aws sso-admin list-applications --instance-arn $INSTANCE_ARN --region ${{ vars.AWS_REGION }} \
            --query "Applications[?Name=='$APP_NAME'].ApplicationArn" --output text)

          if [ -z "$APP_ARN" ] || [ "$APP_ARN" == "None" ]; then
            echo "Creating new SAML application..."
            APP_ARN=$(aws sso-admin create-application \
              --instance-arn $INSTANCE_ARN \
              --application-provider-arn "arn:aws:sso::aws:applicationProvider/custom-saml" \
              --name "$APP_NAME" \
              --description "TEAM Temporary Elevated Access Management" \
              --portal-options "{\"SignInOptions\": {\"Origin\": \"APPLICATION\", \"ApplicationUrl\": \"$START_URL\"}, \"Visibility\": \"VISIBLE\"}" \
              --query 'ApplicationArn' --output text)
          else
            echo "Application exists, updating portal options..."
            aws sso-admin update-application \
              --application-arn $APP_ARN \
              --portal-options "{\"SignInOptions\": {\"Origin\": \"APPLICATION\", \"ApplicationUrl\": \"$START_URL\"}}"
          fi

          aws sso-admin put-application-authentication-method \
            --application-arn $APP_ARN \
            --authentication-method-type "SAML" \
            --authentication-method "{
              \"Saml\": {
                \"InstanceMetadata\": {
                  \"AuthenticationSymmetricAlgorithm\": \"AES128\",
                  \"ReplyUrls\": {
                    \"AssertionConsumerServiceUrls\": [\"$ACS_URL\"]
                  },
                  \"Audience\": \"$AUDIENCE\"
                }
              }
            }"

          aws sso-admin put-application-assignment-configuration \
            --application-arn $APP_ARN \
            --assignment-configuration "{
              \"Attributes\": [
                {
                  \"Value\": \"\${user:subject}\",
                  \"Configuration\": {
                    \"Saml\": {
                      \"AttributeName\": \"Subject\",
                      \"Format\": \"urn:oasis:names:tc:SAML:2.0:nameid-format:persistent\"
                    }
                  }
                },
                {
                  \"Value\": \"\${user:email}\",
                  \"Configuration\": {
                    \"Saml\": {
                      \"AttributeName\": \"email\",
                      \"Format\": \"urn:oasis:names:tc:SAML:2.0:attrname-format:basic\"
                    }
                  }
                }
              ]
            }"

          METADATA_URL=$(aws sso-admin get-application \
            --application-arn $APP_ARN \
            --query 'Application.InstanceMetadata.SsoSamlMetadataUrl' --output text)

          if [ -z "$METADATA_URL" ]; then
            echo "ERROR: Could not retrieve metadata URL"
            exit 1
          fi

          echo "METADATA_URL=$METADATA_URL" >> $GITHUB_OUTPUT
          echo "APP_ARN=$APP_ARN" >> $GITHUB_OUTPUT

      # ---------- STEP 5: Assume Role B again for Cognito configuration ----------
      - name: Assume Role B again for Cognito configuration
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "${{ vars.TEAM_ROLE_B_ARN }}" \
            --role-session-name "GitHubActionsRoleB" \
            --duration-seconds 3600 \
            --output json)
          echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r .Credentials.AccessKeyId)" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r .Credentials.SecretAccessKey)" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo $CREDS | jq -r .Credentials.SessionToken)" >> $GITHUB_ENV
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "Successfully assumed Role B again"
          aws sts get-caller-identity

      - name: Configure Cognito Identity Provider (SAML)
        run: |
          PROVIDER_NAME="IAMIdentityCenter"
          USER_POOL_ID="${{ steps.saml.outputs.USER_POOL_ID }}"
          CLIENT_ID="${{ steps.saml.outputs.CLIENT_ID }}"
          METADATA_URL="${{ steps.saml_app.outputs.METADATA_URL }}"
          AMPLIFY_DOMAIN="${{ steps.saml.outputs.AMPLIFY_DOMAIN }}"

          EXISTS=$(aws cognito-idp list-identity-providers \
            --user-pool-id "$USER_POOL_ID" \
            --query "Providers[?ProviderName=='$PROVIDER_NAME'] | length(@)" \
            --output text || echo "0")

          if [ "$EXISTS" = "0" ]; then
            echo "Creating Cognito SAML provider..."
            aws cognito-idp create-identity-provider \
              --user-pool-id "$USER_POOL_ID" \
              --provider-name "$PROVIDER_NAME" \
              --provider-type SAML \
              --provider-details "MetadataURL=$METADATA_URL" \
              --attribute-mapping "email=email" \
              --idp-identifiers team
          else
            echo "Updating Cognito SAML provider..."
            aws cognito-idp update-identity-provider \
              --user-pool-id "$USER_POOL_ID" \
              --provider-name "$PROVIDER_NAME" \
              --provider-details "MetadataURL=$METADATA_URL" \
              --attribute-mapping "email=email"
          fi

          aws cognito-idp update-user-pool-client \
            --user-pool-id "$USER_POOL_ID" \
            --client-id "$CLIENT_ID" \
            --refresh-token-validity 1 \
            --supported-identity-providers "$PROVIDER_NAME" \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes "phone" "email" "openid" "profile" "aws.cognito.signin.user.admin" \
            --logout-urls "https://main.${AMPLIFY_DOMAIN}/" \
            --callback-urls "https://main.${AMPLIFY_DOMAIN}/" \
            --allowed-o-auth-flows-user-pool-client

      - name: (Optional) Setup machine authentication
        run: |
          cd deployment
          sed -i 's/^[[:space:]]*export[[:space:]]\+AWS_PROFILE=.*/unset AWS_PROFILE/' api-machine-auth.sh 2>/dev/null || true
          chmod +x api-machine-auth.sh
          ./api-machine-auth.sh || echo "Machine auth setup skipped."

      - name: Verify deployment
        run: |
          APP_URL=$(aws amplify list-apps --query "apps[?name=='TEAM-IDC-APP'].defaultDomain" --output text)
          if [ -n "$APP_URL" ]; then
            curl -f "https://main.${APP_URL}/" && echo "TEAM application is online."
          else
            echo "Could not determine app URL."
          fi

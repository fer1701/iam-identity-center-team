# -----------------------------------------------------------------------------
# TEAM (Temporary Elevated Access Management) – automated deploy skeleton
#
# Prerequisites (outside this workflow):
#   - GitHub OIDC → IAM Role A (management account)
#   - Role A may sts:AssumeRole → Role B (TEAM account)
#   - GitHub vars: AWS_REGION, MANAGEMENT_ACCOUNT, TEAM_ACCOUNT, IDC_LOGIN_URL,
#     TEAM_ADMIN_GROUP, TEAM_AUDITOR_GROUP, CLOUDTRAIL_AUDIT_LOGS, TAGS,
#     TEAM_ROLE_B_ARN (and optional UI_DOMAIN, SECRET_NAME, CACHE_TTL, etc.)
#   - GitHub secret: IDC_SAML_METADATA_URL
#       IAM Identity Center SAML metadata URL for the *existing* custom SAML 2.0
#       application that trusts this TEAM environment (ACS + audience must match
#       the values computed below). AWS does not yet expose SAML app creation +
#       metadata URL via supported CLI APIs for customer-managed SAML apps.
#
# This workflow is idempotent in the TEAM account for CodeCommit + stack:
# it deletes the repo and stack before recreating. Management-account delegated
# admin (init.sh) is safe to re-run.
# -----------------------------------------------------------------------------
name: Deploy TEAM
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TEAM_STACK_NAME: TEAM-IDC-APP
  CODECOMMIT_REPO_NAME: team-idc-app
jobs:
  deploy-team:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # -------------------------------------------------------------------------
      # Checkout TEAM sources (this repo or your fork). deployment/ must exist.
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tooling (jq, git-remote-codecommit)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          python3 -m pip install --upgrade pip
          pip install "git-remote-codecommit>=1.15"
      # -------------------------------------------------------------------------
      # Role A – management account (OIDC). Used for init + any future mgmt-only API.
      # -------------------------------------------------------------------------
      - name: Configure AWS credentials (Role A – OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TEAM_ROLE_A_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
      # -------------------------------------------------------------------------
      # parameters.sh – no named profiles; init/deploy expect ./parameters.sh
      # Copy from TEAM template and inject CI values (adjust if you use secrets).
      # -------------------------------------------------------------------------
      - name: Generate deployment/parameters.sh (no AWS profiles)
        working-directory: deployment
        run: |
          set -euo pipefail
          cp -f parameters-template.sh parameters.sh
          # Remove profile exports from the generated file; scripts will use default cred chain.
          sed -i '/^ORG_MASTER_PROFILE=/d;/^TEAM_ACCOUNT_PROFILE=/d' parameters.sh || true
          {
            echo "REGION=${{ vars.AWS_REGION }}"
            echo "TEAM_ACCOUNT=${{ vars.TEAM_ACCOUNT }}"
            echo "IDC_LOGIN_URL=${{ vars.IDC_LOGIN_URL }}"
            echo "TEAM_ADMIN_GROUP=${{ vars.TEAM_ADMIN_GROUP }}"
            echo "TEAM_AUDITOR_GROUP=${{ vars.TEAM_AUDITOR_GROUP }}"
            echo "CLOUDTRAIL_AUDIT_LOGS=${{ vars.CLOUDTRAIL_AUDIT_LOGS }}"
            echo "TAGS=${{ vars.TAGS }}"
            echo "CACHE_TTL=${{ vars.CACHE_TTL }}"
            echo "UI_DOMAIN=${{ vars.UI_DOMAIN }}"
            echo "SECRET_NAME=${{ vars.SECRET_NAME }}"
          } >> parameters.sh
      - name: Patch TEAM scripts – unset AWS_PROFILE and profile usage
        working-directory: deployment
        run: |
          set -euo pipefail
          for f in init.sh deploy.sh integration.sh cognito.sh update.sh destroy.sh api-machine-auth.sh get-machine-auth-credentials.sh; do
            test -f "$f" || continue
            # After sourcing parameters.sh, clear profile so OIDC/assumed-role creds win.
            sed -i 's/^export AWS_PROFILE=/# export AWS_PROFILE=/' "$f" || true
            sed -i 's/export AWS_PROFILE=$/# export AWS_PROFILE=/' "$f" || true
          done
      # -------------------------------------------------------------------------
      # Delegated admin registration in Organizations (management account).
      # -------------------------------------------------------------------------
      - name: Run init.sh (management account)
        working-directory: deployment
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          unset AWS_PROFILE || true
          bash ./init.sh
      # -------------------------------------------------------------------------
      # Assume Role B into TEAM account for CodeCommit, CloudFormation, Amplify, Cognito
      # -------------------------------------------------------------------------
      - name: Assume TEAM account role (Role B)
        id: assume_team
        run: |
          set -euo pipefail
          OUT=$(aws sts assume-role \
            --role-arn "${{ vars.TEAM_ROLE_B_ARN }}" \
            --role-session-name "github-actions-team-deploy" \
            --duration-seconds 3600 \
            --output json)
          echo "AWS_ACCESS_KEY_ID=$(echo "$OUT" | jq -r '.Credentials.AccessKeyId')" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$OUT" | jq -r '.Credentials.SecretAccessKey')" >> "$GITHUB_ENV"
          echo "AWS_SESSION_TOKEN=$(echo "$OUT" | jq -r '.Credentials.SessionToken')" >> "$GITHUB_ENV"
      # -------------------------------------------------------------------------
      # CodeCommit: delete if present (naming conflicts), recreate, push main
      # -------------------------------------------------------------------------
      - name: Reset CodeCommit repository and push TEAM code
        run: |
          set -euo pipefail
          unset AWS_PROFILE || true
          R="${{ env.CODECOMMIT_REPO_NAME }}"
          REGION="${{ env.AWS_REGION }}"
          if aws codecommit get-repository --repository-name "$R" --region "$REGION" &>/dev/null; then
            aws codecommit delete-repository --repository-name "$R" --region "$REGION"
            echo "Deleted existing repository $R"
          fi
          aws codecommit create-repository \
            --region "$REGION" \
            --repository-name "$R" \
            --repository-description "TEAM application (CI)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions"
          git remote remove codecommit 2>/dev/null || true
          git remote add codecommit "codecommit::${REGION}://${R}"
          git push --force codecommit HEAD:main
      # -------------------------------------------------------------------------
      # Delete existing CloudFormation stack (orphan cleanup), then deploy
      # Matches TEAM deploy.sh logic but skips git (already pushed).
      # -------------------------------------------------------------------------
      - name: Delete existing CloudFormation stack (if any)
        working-directory: deployment
        run: |
          set -euo pipefail
          unset AWS_PROFILE || true
          STACK="${{ env.TEAM_STACK_NAME }}"
          REGION="${{ env.AWS_REGION }}"
          if aws cloudformation describe-stacks --stack-name "$STACK" --region "$REGION" &>/dev/null; then
            aws cloudformation delete-stack --stack-name "$STACK" --region "$REGION"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK" --region "$REGION"
          fi
      - name: Deploy CloudFormation stack TEAM-IDC-APP
        working-directory: deployment
        run: |
          set -euo pipefail
          unset AWS_PROFILE || true
          REGION="${{ env.AWS_REGION }}"
          STACK="${{ env.TEAM_STACK_NAME }}"
          TAGS="${{ vars.TAGS }}"
          # Build parameter-overrides like deploy.sh (simplified: always use CodeCommit path with SECRET_NAME empty = custom repo secret branch in original script is complex – align with YOUR parameters-template usage).
          # Minimal example matching TEAM when SECRET_NAME is unset (first block of deploy.sh):
          OVERRIDES=(
            Login=${{ vars.IDC_LOGIN_URL }}
            CloudTrailAuditLogs=${{ vars.CLOUDTRAIL_AUDIT_LOGS }}
            teamAdminGroup=${{ vars.TEAM_ADMIN_GROUP }}
            teamAuditGroup=${{ vars.TEAM_AUDITOR_GROUP }}
            teamAccount=${{ vars.TEAM_ACCOUNT }}
            cacheTTL=${{ vars.CACHE_TTL }}
          )
          if [[ -n "$TAGS" ]]; then
            OVERRIDES+=(tags="$TAGS")
          fi
          if [[ -n "${{ vars.UI_DOMAIN }}" ]]; then
            OVERRIDES+=(customAmplifyDomain=${{ vars.UI_DOMAIN }})
          fi
          EXTRA=(--no-fail-on-empty-changeset --capabilities CAPABILITY_NAMED_IAM)
          if [[ -n "$TAGS" ]]; then
            EXTRA+=(--tags $TAGS)
          fi
          aws cloudformation deploy \
            --region "$REGION" \
            --template-file template.yml \
            --stack-name "$STACK" \
            --parameter-overrides "${OVERRIDES[@]}" \
            "${EXTRA[@]}"
      # -------------------------------------------------------------------------
      # Resolve Amplify app id from stack resources (avoid hardcoded pool/app names)
      # -------------------------------------------------------------------------
      - name: Wait for Amplify main branch build (poll)
        id: amplify
        working-directory: deployment
        run: |
          set -euo pipefail
          unset AWS_PROFILE || true
          REGION="${{ env.AWS_REGION }}"
          STACK="${{ env.TEAM_STACK_NAME }}"
          APP_ID=$(aws cloudformation describe-stack-resources \
            --region "$REGION" \
            --stack-name "$STACK" \
            --query "StackResources[?ResourceType=='AWS::Amplify::App'].PhysicalResourceId | [0]" \
            --output text)
          test -n "$APP_ID" && test "$APP_ID" != "None"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          DEADLINE=$(( $(date +%s) + 3600 ))
          while true; do
            JOB=$(aws amplify list-jobs --region "$REGION" --app-id "$APP_ID" --branch-name main --max-results 1 --output json)
            STATUS=$(echo "$JOB" | jq -r '.jobSummaries[0].status // "PENDING"')
            if [[ "$STATUS" == "SUCCEED" ]]; then
              echo "Amplify build succeeded."
              break
            fi
            if [[ "$STATUS" == "FAILED" ]] || [[ "$STATUS" == "CANCELLED" ]]; then
              echo "Amplify build ended with status: $STATUS" >&2
              echo "$JOB" | jq . >&2
              exit 1
            fi
            if [[ $(date +%s) -gt $DEADLINE ]]; then
              echo "Timeout waiting for Amplify build" >&2
              exit 1
            fi
            echo "Amplify status: $STATUS – sleeping 30s"
            sleep 30
          done
      # -------------------------------------------------------------------------
      # Cognito + Amplify discovery (TEAM account) – same logic as integration.sh
      # Prefer stack resource physical IDs over name substring "team06dbb7fc".
      # -------------------------------------------------------------------------
      - name: Build SAML parameter URLs and write Cognito details.json
        id: saml
        run: |
          set -euo pipefail
          unset AWS_PROFILE || true
          REGION="${{ env.AWS_REGION }}"
          STACK="${{ env.TEAM_STACK_NAME }}"
          POOL_ID=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK" \
            --region "$REGION" \
            --query "StackResources[?ResourceType=='AWS::Cognito::UserPool'].PhysicalResourceId | [0]" \
            --output text)
          APP_ID="${{ steps.amplify.outputs.app_id }}"
          DOMAIN_PREFIX=$(aws cognito-idp describe-user-pool \
            --user-pool-id "$POOL_ID" --region "$REGION" \
            --query 'UserPool.Domain' --output text)
          CLIENT_ID=$(aws cognito-idp list-user-pool-clients \
            --user-pool-id "$POOL_ID" --region "$REGION" --max-results 60 \
            --output json | jq -r '.UserPoolClients[] | select(.ClientName | test("clientWeb")) | .ClientId' | head -1)
          DEFAULT_DOMAIN=$(aws amplify get-app --app-id "$APP_ID" --region "$REGION" \
            --query 'app.defaultDomain' --output text)
          AMPLIFY_HOST="main.${DEFAULT_DOMAIN}"
          COGNITO_HOST="${DOMAIN_PREFIX}.auth.${REGION}.amazoncognito.com"
          START="https://${COGNITO_HOST}/authorize?client_id=${CLIENT_ID}&response_type=code&scope=aws.cognito.signin.user.admin+email+openid+phone+profile&redirect_uri=https://${AMPLIFY_HOST}/&idp_identifier=team"
          ACS="https://${COGNITO_HOST}/saml2/idpresponse"
          AUDIENCE="urn:amazon:cognito:sp:${POOL_ID}"
          echo "applicationStartURL=$START" >> "$GITHUB_OUTPUT"
          echo "applicationACSURL=$ACS" >> "$GITHUB_OUTPUT"
          echo "applicationSAMLAudience=$AUDIENCE" >> "$GITHUB_OUTPUT"
          echo "cognitoUserPoolId=$POOL_ID" >> "$GITHUB_OUTPUT"
          echo "cognitoClientId=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "amplifyUrl=https://${AMPLIFY_HOST}/" >> "$GITHUB_OUTPUT"
          jq -n --arg url "${{ secrets.IDC_SAML_METADATA_URL }}" '{MetadataURL: $url}' > deployment/details.json
      # -------------------------------------------------------------------------
      # IAM Identity Center custom SAML app – NOT fully automatable via supported CLI.
      # Print computed SP values for documentation / console alignment; operator
      # must ensure the IDC SAML app + secret IDC_SAML_METADATA_URL match them.
      # -------------------------------------------------------------------------
      - name: SAML application (documentation / manual parity)
        run: |
          set -euo pipefail
          echo "Configure (or verify) the IAM Identity Center custom SAML 2.0 application in the console so that:"
          echo "  Application start URL: ${{ steps.saml.outputs.applicationStartURL }}"
          echo "  Application ACS URL:   ${{ steps.saml.outputs.applicationACSURL }}"
          echo "  Application SAML audience: ${{ steps.saml.outputs.applicationSAMLAudience }}"
          echo "Then store the IAM Identity Center SAML metadata URL in GitHub secret IDC_SAML_METADATA_URL."
          if [[ -z "${{ secrets.IDC_SAML_METADATA_URL }}" ]]; then
            echo "::error::Secret IDC_SAML_METADATA_URL is not set. Cognito cannot trust IAM Identity Center without IdP metadata."
            exit 1
          fi
      # -------------------------------------------------------------------------
      # Cognito: SAML IdP + client (same as cognito.sh; idempotent-ish)
      # -------------------------------------------------------------------------
      - name: Configure Cognito SAML provider and app client
        working-directory: deployment
        run: |
          set -euo pipefail
          unset AWS_PROFILE || true
          REGION="${{ env.AWS_REGION }}"
          POOL="${{ steps.saml.outputs.cognitoUserPoolId }}"
          CLIENT="${{ steps.saml.outputs.cognitoClientId }}"
          HOST=$(echo "${{ steps.saml.outputs.amplifyUrl }}" | sed 's|https://||;s|/$||')
          if aws cognito-idp describe-identity-provider --user-pool-id "$POOL" --provider-name IDC --region "$REGION" &>/dev/null; then
            aws cognito-idp update-identity-provider \
              --user-pool-id "$POOL" --provider-name IDC --region "$REGION" \
              --provider-details file://details.json \
              --attribute-mapping email=Email
          else
            aws cognito-idp create-identity-provider \
              --user-pool-id "$POOL" --provider-name IDC --provider-type SAML \
              --region "$REGION" \
              --provider-details file://details.json \
              --attribute-mapping email=Email \
              --idp-identifiers team
          fi
          aws cognito-idp update-user-pool-client \
            --user-pool-id "$POOL" --client-id "$CLIENT" --region "$REGION" \
            --refresh-token-validity 1 \
            --supported-identity-providers IDC \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes phone email openid profile aws.cognito.signin.user.admin \
            --logout-urls "https://${HOST}/" \
            --callback-urls "https://${HOST}/" \
            --allowed-o-auth-flows-user-pool-client
      # -------------------------------------------------------------------------
      # Optional: api-machine-auth.sh – uncomment if you use machine auth
      # -------------------------------------------------------------------------
      # - name: API machine authentication setup
      #   working-directory: deployment
      #   run: bash ./api-machine-auth.sh
      - name: Verify Amplify URL responds
        run: |
          set -euo pipefail
          URL="${{ steps.saml.outputs.amplifyUrl }}"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
          echo "HTTP $code for $URL"
          # 200 or 3xx acceptable for SPA; adjust as needed
          case "$code" in
            2*|3*) exit 0 ;;
            *) exit 1 ;;
          esac

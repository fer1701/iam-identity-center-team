name: Deploy TEAM Application (Full Automated)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  MANAGEMENT_ACCOUNT: ${{ vars.MANAGEMENT_ACCOUNT }}
  TEAM_ACCOUNT: ${{ vars.TEAM_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- STEP 1: Assume Role A (Management) for init.sh ----------
      - name: Configure AWS credentials (Role A)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate parameters.sh
        run: |
          cd deployment
          cat > parameters.sh <<EOF
          IDC_LOGIN_URL="${{ vars.IDC_LOGIN_URL }}"
          REGION="${{ vars.AWS_REGION }}"
          TEAM_ACCOUNT="${{ vars.TEAM_ACCOUNT }}"
          ORG_MASTER_PROFILE=""
          TEAM_ACCOUNT_PROFILE=""
          TEAM_ADMIN_GROUP="${{ vars.TEAM_ADMIN_GROUP }}"
          TEAM_AUDITOR_GROUP="${{ vars.TEAM_AUDITOR_GROUP }}"
          TAGS="${{ vars.TAGS }}"
          CLOUDTRAIL_AUDIT_LOGS="${{ vars.CLOUDTRAIL_AUDIT_LOGS }}"
          UI_DOMAIN="${{ vars.UI_DOMAIN }}"
          SECRET_NAME="${{ vars.SECRET_NAME }}"
          CACHE_TTL=604800
          EOF

      - name: Run init.sh (delegated admin setup)
        run: |
          cd deployment
          chmod +x init.sh
          ./init.sh

      # ---------- STEP 2: Assume Role B (TEAM account) for deployment ----------
      - name: Assume Role B manually
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "${{ vars.TEAM_ROLE_B_ARN }}" \
            --role-session-name "GitHubActionsRoleB" \
            --duration-seconds 3600 \
            --output json)
          echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r .Credentials.AccessKeyId)" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r .Credentials.SecretAccessKey)" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo $CREDS | jq -r .Credentials.SessionToken)" >> $GITHUB_ENV
          echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
          echo "Successfully assumed Role B"
          aws sts get-caller-identity

      - name: Install git-remote-codecommit
        run: |
          pipx install git-remote-codecommit
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Reinitialize local git repository (fresh commit)
        run: |
          rm -rf .git
          git init -b main
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git commit -m "Initial commit for TEAM deployment"
          git fsck

      - name: Patch deploy.sh
        run: |
          cd deployment
          sed -i 's/^[[:space:]]*export[[:space:]]\+AWS_PROFILE=.*/unset AWS_PROFILE/' deploy.sh
          sed -i 's/git push origin main/git push --force origin main/' deploy.sh
          sed -i 's/git remote remove origin/git remote remove origin || true/' deploy.sh

      - name: Delete CodeCommit repository if exists (idempotency)
        run: |
          aws codecommit delete-repository --repository-name team-idc-app --region ${{ vars.AWS_REGION }} || echo "Repository not found, continuing."

      - name: Delete existing CloudFormation stack if in failed state
        run: |
          aws cloudformation delete-stack --stack-name TEAM-IDC-APP --region ${{ vars.AWS_REGION }} || echo "Stack does not exist or already deleted"
          aws cloudformation wait stack-delete-complete --stack-name TEAM-IDC-APP --region ${{ vars.AWS_REGION }} || echo "No stack to wait for"

      - name: Run deploy.sh
        run: |
          cd deployment
          chmod +x deploy.sh
          ./deploy.sh

      - name: Wait for Amplify deployment
        run: |
          APP_ID=$(aws cloudformation describe-stacks --stack-name TEAM-IDC-APP --query "Stacks[0].Outputs[?OutputKey=='AppId'].OutputValue" --output text)
          if [ -n "$APP_ID" ]; then
            echo "Amplify App ID: $APP_ID"
            while true; do
              STATUS=$(aws amplify get-app --app-id $APP_ID --query "app.status" --output text)
              echo "Amplify status: $STATUS"
              if [ "$STATUS" = "AVAILABLE" ]; then break; fi
              if [ "$STATUS" = "FAILED" ]; then exit 1; fi
              sleep 30
            done
          fi

      # ---------- STEP 3: SAML Integration (needs management account) ----------
      - name: Switch to management account (Role A) for SAML app
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.MANAGEMENT_ACCOUNT }}:role/GitHubActions-TEAM-RoleA
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run integration.sh and capture SAML parameters
        id: saml
        run: |
          cd deployment
          # Patch integration.sh to unset AWS_PROFILE
          sed -i 's/^[[:space:]]*export[[:space:]]\+AWS_PROFILE=.*/unset AWS_PROFILE/' integration.sh
          ./integration.sh > /tmp/saml.txt
          echo "START_URL=$(grep applicationStartURL /tmp/saml.txt | cut -d' ' -f2)" >> $GITHUB_OUTPUT
          echo "ACS_URL=$(grep applicationACSURL /tmp/saml.txt | cut -d' ' -f2)" >> $GITHUB_OUTPUT
          echo "AUDIENCE=$(grep applicationSAMLAudience /tmp/saml.txt | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Create or update SAML 2.0 application
        id: saml_app
        run: |
          INSTANCE_ARN=$(aws sso-admin list-instances --region ${{ vars.AWS_REGION }} --query "Instances[0].InstanceArn" --output text)
          APP_ARN=$(aws sso-admin list-applications --region ${{ vars.AWS_REGION }} --instance-arn "$INSTANCE_ARN" --query "Applications[?Name=='TEAM-IDC-APP'].ApplicationArn" --output text)
          if [ -z "$APP_ARN" ]; then
            echo "Creating new SAML application..."
            APP_ARN=$(aws sso-admin create-application \
              --name "TEAM-IDC-APP" \
              --description "TEAM Temporary Elevated Access Management" \
              --application-provider-arn "arn:aws:sso::aws:applicationProvider/custom" \
              --instance-arn "$INSTANCE_ARN" \
              --portal-options "SignInUrl=${{ steps.saml.outputs.START_URL }}" \
              --query "ApplicationArn" --output text)
          else
            echo "Updating existing SAML application: $APP_ARN"
            aws sso-admin update-application \
              --application-arn "$APP_ARN" \
              --portal-options "SignInUrl=${{ steps.saml.outputs.START_URL }}"
          fi
          METADATA_URL="https://portal.sso.${{ vars.AWS_REGION }}.amazonaws.com/saml/metadata/$(echo $INSTANCE_ARN | cut -d'/' -f2)"
          echo "METADATA_URL=$METADATA_URL" >> $GITHUB_OUTPUT
          echo "APP_ARN=$APP_ARN" >> $GITHUB_OUTPUT

      # ---------- STEP 4: Configure Cognito (back to TEAM account) ----------
      - name: Switch back to TEAM account (Role B) for cognito.sh
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TEAM_ROLE_B_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run cognito.sh
        run: |
          cd deployment
          echo '{"MetadataURL": "${{ steps.saml_app.outputs.METADATA_URL }}"}' > details.json
          sed -i 's/^[[:space:]]*export[[:space:]]\+AWS_PROFILE=.*/unset AWS_PROFILE/' cognito.sh
          chmod +x cognito.sh
          ./cognito.sh

      - name: (Optional) Setup machine authentication
        run: |
          cd deployment
          sed -i 's/^[[:space:]]*export[[:space:]]\+AWS_PROFILE=.*/unset AWS_PROFILE/' api-machine-auth.sh
          chmod +x api-machine-auth.sh
          ./api-machine-auth.sh || echo "Machine auth setup skipped."

      - name: Verify deployment
        run: |
          APP_URL=$(aws amplify list-apps --query "apps[?name=='TEAM-IDC-APP'].defaultDomain" --output text)
          if [ -n "$APP_URL" ]; then
            curl -f "https://$APP_URL" && echo "TEAM application is online."
          else
            echo "Could not determine app URL."
          fi
